<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Company CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">Company CRM</h1>
      <p class="text-gray-500 mt-2">Malaysia</p>
    </div>

    <div class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="email" 
               class="w-full border border-gray-300 rounded-xl p-4 focus:outline-none focus:border-indigo-500"
               placeholder="employee@company.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" 
               class="w-full border border-gray-300 rounded-xl p-4 focus:outline-none focus:border-indigo-500"
               placeholder="Enter password">
      </div>

      <button id="loginBtn" onclick="login()" 
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-2xl transition">
        Login
      </button>

      <p id="loginError" class="text-center text-sm text-red-600 hidden"></p>
      <p class="text-center text-sm text-gray-500">
        Account provided by company
      </p>
    </div>
  </div>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getUserRole } from "./js/auth-helpers.js";

    let isRedirecting = false;

    onAuthStateChanged(auth, async (user) => {
      if (user && !isRedirecting) {
        isRedirecting = true;
        try {
          const profile = await getUserRole();
          
          switch (profile.role) {
            case "admin":
              window.location.href = "dashboard.html";
              break;
            case "hr":
              window.location.href = "hr.html";
              break;
            case "finance":
              window.location.href = "invoices.html";
              break;
            default:
              window.location.href = "sales.html";
          }
        } catch (e) {
          console.error(e);
          window.location.href = "sales.html";
        }
      }
    });

    window.login = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        errEl.textContent = "Please enter email and password.";
        errEl.classList.remove("hidden");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";
      errEl.classList.add("hidden");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Redirect will be handled by onAuthStateChanged
      } catch (error) {
        errEl.textContent = "Login failed: " + (error.message || "Unknown error");
        errEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Login";
      }
    };

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.login();
    });
  </script>
</body>
</html>
